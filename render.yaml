services:
  - type: web
    name: pinktt
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Deliberately on: the demo rider / approved driver / pending driver logins are how
      # the app gets shown and tested on a real device. Note this also puts the admin
      # credentials on the public login page, so set it back to "false" before the app is
      # handed to real riders.
      - key: SHOW_DEMO_ACCOUNTS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
