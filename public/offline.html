<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7a1263">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pink.TT — You're Offline</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#E91E8C;--pp:#FFF0F6}
html,body{height:100%;font-family:'DM Sans',system-ui,sans-serif;background:#7a1263}
h1{font-family:'Playfair Display',Georgia,serif}
/* viewport-fit=cover above is what lets position:fixed backgrounds actually reach under
   the status bar / home-indicator notch instead of stopping at the OS "safe" area --
   height:100dvh (not 100vh) matches how the main app handles the mobile browser address
   bar, and the safe-area padding keeps the actual text/button clear of the notch/gesture
   bar while the video+wash behind them still go edge-to-edge. */
#shell{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;height:100dvh;width:100%;margin:0 auto;padding:calc(32px + env(safe-area-inset-top,0px)) 24px calc(32px + env(safe-area-inset-bottom,0px));text-align:center;position:relative;overflow:hidden}
.bg-video{position:fixed;top:50%;left:50%;width:124%;height:124%;transform:translate3d(-50%,-50%,0);will-change:transform;object-fit:cover;z-index:0;opacity:.6}
.bg-wash{position:fixed;inset:0;z-index:0;background:linear-gradient(165deg,rgba(255,47,168,.35),rgba(122,18,99,.55));pointer-events:none}
#shell>:not(.bg-video):not(.bg-wash){position:relative;z-index:1}
.logo-dot{width:56px;height:56px;border-radius:16px;background:#fff;color:var(--p);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;font-size:26px;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
h1{font-size:22px;margin-bottom:8px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.25)}
p{color:rgba(255,255,255,.92);font-size:14px;line-height:1.6;margin-bottom:24px;text-shadow:0 1px 6px rgba(0,0,0,.2)}
.btn{display:inline-block;background:#fff;color:var(--p);text-decoration:none;font-weight:700;font-size:14px;padding:12px 28px;border-radius:16px;border:none;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.btn:disabled{opacity:.7;cursor:default}
@media (prefers-reduced-motion:reduce){.bg-video{display:none}}
</style>
</head>
<body>
<div id="shell">
  <video class="bg-video" id="bg-video" autoplay loop muted playsinline><source src="/api/app-background.mp4" type="video/mp4"><source src="/api/app-background.webm" type="video/webm"><source src="/media/install-banner-bg.mp4?v=5" type="video/mp4"><source src="/media/install-banner-bg.webm?v=5" type="video/webm"></video>
  <div class="bg-wash"></div>
  <div class="logo-dot">P</div>
  <h1>You're offline</h1>
  <p id="offline-msg">We can't reach Pink.TT right now. Check your connection and try again — your safety features need a live connection to work.</p>
  <button class="btn" id="retry-btn" onclick="location.reload()">Try Again</button>
</div>
<script>
// This screen can legitimately sit here for minutes while someone waits for signal --
// the background loop has to survive that whole time, not just autoplay once. Mobile
// browsers commonly pause background video on screen lock / app backgrounding / low
// power mode, and `loop` alone doesn't resume a video that's been paused externally --
// so re-assert play() every time the page becomes visible again, and immediately if the
// video itself ever reports paused while the page is visible.
// Match whatever wallpaper the app itself last picked, so the offline screen belongs to
// the same session rather than always showing one fixed clip. Falls back silently to the
// hardcoded <source> already in the markup if there's nothing stored (or storage is
// blocked), which is also the copy the service worker precached -- important here, since
// this page has to render with no network at all.
const vid = document.getElementById('bg-video');
try{
  const last=localStorage.getItem('ptt_last_wallpaper');
  if(last&&/^[a-z0-9-]+$/i.test(last)&&!vid.querySelector(`source[src*="${last}"]`)){
    vid.innerHTML=`<source src="/media/${last}.mp4?v=5" type="video/mp4"><source src="/media/${last}.webm?v=5" type="video/webm">`;
    vid.load();
  }
}catch(e){}
// Also nudges currentTime forward by one frame when the video is still technically
// playing (paused stays false) but may be stuck on a stale frame -- same fix as the
// main app's _keepWallpapersPlaying, brought here for parity since this screen can sit
// open even longer than a normal page visit.
function keepLoopAlive(){
  if(document.visibilityState !== 'visible') return;
  if(vid.paused){vid.play().catch(()=>{});return;}
  if(vid.readyState>=2&&vid.duration>0){
    const nudged=vid.currentTime+0.033;
    vid.currentTime=nudged<vid.duration?nudged:0;
  }
}
document.addEventListener('visibilitychange', keepLoopAlive);
window.addEventListener('pageshow', keepLoopAlive);
vid.addEventListener('pause', keepLoopAlive);
setInterval(keepLoopAlive, 10000);

// The whole point of this screen is "come back on its own once wifi returns" rather
// than making someone remember to tap Try Again -- listen for the browser's own
// connectivity signal and reload the instant it fires. Try Again stays as a manual
// fallback for cases the online event misses (e.g. wifi connected but no real route
// to the internet).
window.addEventListener('online', ()=>{
  document.getElementById('offline-msg').textContent = "Back online — reloading…";
  document.getElementById('retry-btn').textContent = 'Reloading…';
  document.getElementById('retry-btn').disabled = true;
  setTimeout(()=>location.reload(), 400);
});
</script>
</body>
</html>
