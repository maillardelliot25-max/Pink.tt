<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7a1263">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Reset Password: Pink.TT</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#E91E8C;--pp:#FFF0F6;--r:#dc2626}
html,body{height:100%;font-family:'DM Sans',system-ui,sans-serif;background:#7a1263}
h1{font-family:'Playfair Display',Georgia,serif}
#shell{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;height:100dvh;width:100%;padding:calc(32px + env(safe-area-inset-top,0px)) 24px calc(32px + env(safe-area-inset-bottom,0px));text-align:center;position:relative;overflow:hidden}
.bg-video{position:fixed;top:50%;left:50%;width:124%;height:124%;transform:translate(-50%,-50%);object-fit:cover;z-index:0;opacity:.6}
.bg-wash{position:fixed;inset:0;z-index:0;background:linear-gradient(165deg,rgba(255,47,168,.35),rgba(122,18,99,.55));pointer-events:none}
#shell>:not(.bg-video):not(.bg-wash){position:relative;z-index:1}
.card{background:#fff;border-radius:24px;padding:32px 26px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.3);text-align:left}
.logo-dot{width:48px;height:48px;border-radius:14px;background:var(--pp);color:var(--p);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;font-size:22px;margin:0 auto 16px}
h2{font-size:20px;text-align:center;color:#111;margin-bottom:6px}
p.sub{text-align:center;color:#6b7280;font-size:13px;line-height:1.6;margin-bottom:22px}
.fg{margin-bottom:14px}
.lbl{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:6px}
.inp{width:100%;padding:12px 14px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:15px;font-family:inherit;outline:none}
.inp:focus{border-color:var(--p)}
.btn{width:100%;background:var(--p);color:#fff;border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px}
.btn:disabled{opacity:.6;cursor:default}
.msg{font-size:13px;border-radius:12px;padding:12px 14px;margin-bottom:16px;line-height:1.5}
.msg.ok{background:#dcfce7;color:#166534}
.msg.err{background:#fee2e2;color:var(--r)}
.back{display:block;text-align:center;margin-top:18px;font-size:13px;color:#9ca3af;text-decoration:none}
.demo-note{font-size:11px;color:#9ca3af;margin-top:14px;line-height:1.6;word-break:break-all}
</style>
</head>
<body>
<div id="shell">
  <video class="bg-video" id="bg-video" autoplay loop muted playsinline>
    <source src="/api/app-background.mp4" type="video/mp4">
    <source src="/api/app-background.webm" type="video/webm">
    <source src="/media/install-banner-bg.mp4?v=5" type="video/mp4">
    <source src="/media/install-banner-bg.webm?v=5" type="video/webm">
  </video>
  <div class="bg-wash"></div>

  <div class="card">
    <div class="logo-dot">P</div>

    <!-- Step 1: request a reset link by email -->
    <div id="step-request">
      <h2>Reset your password</h2>
      <p class="sub">Enter the email on your Pink.TT account and we'll send you a link to set a new password.</p>
      <div id="request-msg"></div>
      <div class="fg">
        <label class="lbl">Email address</label>
        <input class="inp" type="email" id="rp-email" placeholder="you@example.com" autocomplete="email">
      </div>
      <button class="btn" id="rp-send-btn" onclick="sendResetLink()">Send Reset Link</button>
      <div id="demo-note" class="demo-note" style="display:none"></div>
    </div>

    <!-- Step 2: shown only when arriving via ?token=... from the emailed link -->
    <div id="step-reset" style="display:none">
      <h2>Set a new password</h2>
      <p class="sub">Choose a new password for your account.</p>
      <div id="reset-msg"></div>
      <div class="fg">
        <label class="lbl">New password</label>
        <input class="inp" type="password" id="rp-pass" placeholder="8+ characters" autocomplete="new-password">
      </div>
      <div class="fg">
        <label class="lbl">Confirm password</label>
        <input class="inp" type="password" id="rp-pass2" placeholder="Retype password" autocomplete="new-password">
      </div>
      <button class="btn" id="rp-reset-btn" onclick="submitNewPassword()">Update Password</button>
    </div>

    <a class="back" href="/">← Back to Pink.TT</a>
  </div>
</div>
<script>
const params=new URLSearchParams(location.search);
const token=params.get('token');
if(token){
  document.getElementById('step-request').style.display='none';
  document.getElementById('step-reset').style.display='block';
}

function showMsg(elId,text,kind){
  document.getElementById(elId).innerHTML=`<div class="msg ${kind}">${text}</div>`;
}

async function sendResetLink(){
  const email=document.getElementById('rp-email').value.trim();
  if(!email){showMsg('request-msg','Please enter your email.','err');return;}
  const btn=document.getElementById('rp-send-btn');
  btn.disabled=true;btn.textContent='Sending...';
  try{
    const res=await fetch('/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const data=await res.json();
    if(!res.ok){showMsg('request-msg',data.error||'Something went wrong. Please try again.','err');}
    else{
      showMsg('request-msg',data.message,'ok');
      document.getElementById('rp-email').value='';
      const note=document.getElementById('demo-note');
      if(data.demo&&data.resetLink){
        note.style.display='block';
        note.innerHTML=`No email is configured on this server yet, so here's the link directly: <a href="${data.resetLink}">${data.resetLink}</a>`;
      }
    }
  }catch(e){showMsg('request-msg','Network error. Please check your connection and try again.','err');}
  btn.disabled=false;btn.textContent='Send Reset Link';
}

async function submitNewPassword(){
  const pass=document.getElementById('rp-pass').value;
  const pass2=document.getElementById('rp-pass2').value;
  if(pass.length<8){showMsg('reset-msg','Password must be at least 8 characters.','err');return;}
  if(pass!==pass2){showMsg('reset-msg','Passwords do not match.','err');return;}
  const btn=document.getElementById('rp-reset-btn');
  btn.disabled=true;btn.textContent='Updating...';
  try{
    const res=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:pass})});
    const data=await res.json();
    if(!res.ok||!data.ok){showMsg('reset-msg',data.error||'Something went wrong. Please try again.','err');btn.disabled=false;btn.textContent='Update Password';return;}
    showMsg('reset-msg','Password updated! Redirecting you to sign in…','ok');
    document.getElementById('rp-pass').value='';document.getElementById('rp-pass2').value='';
    btn.style.display='none';
    setTimeout(()=>location.href='/',1500);
  }catch(e){showMsg('reset-msg','Network error. Please check your connection and try again.','err');btn.disabled=false;btn.textContent='Update Password';}
}
</script>
</body>
</html>
